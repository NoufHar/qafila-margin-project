version: 2
models:
  - name: stg_supplier_prices
    columns:
      - name: sku
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]
      - name: source_file
        data_tests: [not_null]
  - name: product_cost_history
    columns:
      - name: sku
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]
      - name: unit_cost_sar
        data_tests: [not_null]
      - name: is_current
        data_tests: [not_null]
  - name: weekly_margin
    columns:
      - name: iso_week
        data_tests: [not_null]
      - name: city
        data_tests: [not_null]
      - name: category
        data_tests: [not_null]
  - name: price_quarantine
    columns:
      - name: reason
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['unknown_sku', 'invalid_cost']
